# Configurazione per il training del modello TimedPolicyGNN
data_dir: "Dataset/Train"
time_stats_json: "Dataset/avg_time_by_rating.json"
checkpoint_dir: "Modelli_Andrea/Checkpoints"
results_dir: "Modelli_Andrea/Results"

epochs: 50
batch_size: 64
lr: 0.001
hidden_dim: 128
num_layers: 6
lambda_decay: 0.01
mate_loss_weight: 0.3
patience: 7
num_workers: 6
seed: 42
grad_clip: 1.0
compile: false
es_metric: "val_move_acc"
max_mate_depth_eval: 10